unit_tests:
  - name: test_tick_daily_aggregates_by_tick
    description: >
      Verifies daily aggregation of int_tick_changes by tick.
      4 sessions: tick=100 (sessions 1 and 3), tick=101 (session 2), tick=102 (session 4).
      Session 4 has duration_seconds=NULL (open) → EXCLUDED by WHERE duration_seconds IS NOT NULL.
    model: mart_tick_daily

    given:
      - input: ref('int_tick_changes')
        rows:
          - pool: "0xpool1"
            session_id: 1
            tick: 100
            price_token1_in_token0: 3500.0
            start_block: 10
            start_time: "2024-01-01 10:00:00"
            end_block: 11
            end_time: "2024-01-01 11:00:00"
            duration_seconds: 3600
            next_tick: 101
            direction: "up"
            swap_count: 5
            volume_token0_equiv: 100.0
          - pool: "0xpool1"
            session_id: 2
            tick: 101
            price_token1_in_token0: 3499.65
            start_block: 11
            start_time: "2024-01-01 11:00:00"
            end_block: 12
            end_time: "2024-01-01 11:30:00"
            duration_seconds: 1800
            next_tick: 100
            direction: "down"
            swap_count: 2
            volume_token0_equiv: 50.0
          - pool: "0xpool1"
            session_id: 3
            tick: 100
            price_token1_in_token0: 3500.0
            start_block: 12
            start_time: "2024-01-01 11:30:00"
            end_block: 13
            end_time: "2024-01-01 13:30:00"
            duration_seconds: 7200
            next_tick: ~
            direction: ~
            swap_count: 3
            volume_token0_equiv: 200.0
          - pool: "0xpool1"
            session_id: 4
            tick: 102
            price_token1_in_token0: 3499.3
            start_block: 13
            start_time: "2024-01-01 13:30:00"
            end_block: ~
            end_time: ~
            duration_seconds: ~
            next_tick: ~
            direction: ~
            swap_count: 1
            volume_token0_equiv: 10.0

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          tick: 100
          time_seconds: 10800
          volume_token0_equiv: 300.0
          swap_count: 8
        - pool: "0xpool1"
          date: "2024-01-01"
          tick: 101
          time_seconds: 1800
          volume_token0_equiv: 50.0
          swap_count: 2

  - name: test_tick_sigma_evc_hourly_aligns_hourly_volume_with_hour_end_liquidity
    description: >
      Joins hourly volume attributed to a tick with the containing hour-end
      liquidity bin, annualizes the hourly flow, and exposes sigma_evc_last.
    model: mart_tick_sigma_evc_hourly

    given:
      - input: ref('int_tick_volume_hourly')
        rows:
          - pool: "0xpool1"
            hour: "2024-01-01 10:00:00"
            tick: 105
            swap_count: 2
            fallback_after_swap_count: 1
            volume_token0: 1500.0
            volume_token1: 0.75
            volume_token0_equiv: 1500.0
            fees_generated_token0: 0.75
            fees_generated_token1: 0.0
            fees_generated_token0_equiv: 0.75

      - input: ref('int_hourly_tick_liquidity_net')
        rows:
          - pool: "0xpool1"
            hour: "2024-01-01 10:00:00"
            tick: 100
            liquidity_net: 1000
          - pool: "0xpool1"
            hour: "2024-01-01 10:00:00"
            tick: 110
            liquidity_net: -1000

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xToken0"
            token0_symbol: "TOKEN0"
            token0_decimals: 0
            token1_address: "0xToken1"
            token1_symbol: "TOKEN1"
            token1_decimals: 0
            deployment_block: 1
            deployment_ts: "2024-01-01 00:00:00"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          hour: "2024-01-01 10:00:00"
          tick: 105
          tick_lower: 100
          tick_upper: 110
          tick_liquidity_end: 1000.0
          volume_token0_equiv_annualized: 13140000.0
          volume_per_tick_liquidity_last: 13140.0
          sigma_evc_last: 0.11462983904725679
          fallback_after_swap_count: 1

  - name: test_tick_liquidity_volume_daily_aligns_tick_volume_with_daily_and_hourly_liquidity
    description: >
      Joins daily tick volume with the daily end-of-day liquidity bin, computes a
      daily TWAP liquidity denominator from hourly snapshots, and attaches hourly
      sigma_evc distribution stats.
    model: mart_tick_liquidity_volume_daily

    given:
      - input: ref('int_tick_volume_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tick: 105
            swap_count: 2
            fallback_after_swap_count: 1
            volume_token0: 1500.0
            volume_token1: 0.75
            volume_token0_equiv: 1500.0
            fees_generated_token0: 0.75
            fees_generated_token1: 0.0
            fees_generated_token0_equiv: 0.75

      - input: ref('int_daily_tick_liquidity_net')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tick: 100
            liquidity_net: 1000
          - pool: "0xpool1"
            date: "2024-01-01"
            tick: 110
            liquidity_net: -1000

      - input: ref('int_hourly_tick_liquidity_net')
        rows:
          - pool: "0xpool1"
            hour: "2024-01-01 10:00:00"
            tick: 100
            liquidity_net: 1000
          - pool: "0xpool1"
            hour: "2024-01-01 10:00:00"
            tick: 110
            liquidity_net: -1000
          - pool: "0xpool1"
            hour: "2024-01-01 11:00:00"
            tick: 100
            liquidity_net: 500
          - pool: "0xpool1"
            hour: "2024-01-01 11:00:00"
            tick: 110
            liquidity_net: -500

      - input: ref('mart_tick_sigma_evc_hourly')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            hour: "2024-01-01 10:00:00"
            tick: 105
            sigma_evc_last: 0.11462983904725679

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xToken0"
            token0_symbol: "TOKEN0"
            token0_decimals: 0
            token1_address: "0xToken1"
            token1_symbol: "TOKEN1"
            token1_decimals: 0
            deployment_block: 1
            deployment_ts: "2024-01-01 00:00:00"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          tick: 105
          tick_lower: 100
          tick_upper: 110
          tick_liquidity_end: 1000.0
          tick_liquidity_twap: 750.0
          tick_liquidity: 1000.0
          volume_token0_equiv: 1500.0
          volume_token0_equiv_annualized: 547500.0
          volume_per_tick_liquidity_last: 547.5
          volume_per_tick_liquidity_twap: 730.0
          sigma_evc_last: 0.02339871791359518
          sigma_evc_twap: 0.027018512172212593
          sigma_evc_mean: 0.11462983904725679
          sigma_evc_std: ~
          sigma_evc_p95: 0.11462983904725679
          fallback_after_swap_count: 1

  - name: test_tick_sigma_evc_weekly_aligns_weekly_volume_with_last_and_twap_liquidity
    description: >
      Joins weekly tick volume with week-end boundary liquidity, computes a TWAP
      liquidity denominator from daily snapshots, and summarizes daily sigma_evc.
    model: mart_tick_sigma_evc_weekly

    given:
      - input: ref('int_tick_volume_weekly')
        rows:
          - pool: "0xpool1"
            week_start: "2024-01-01"
            tick: 105
            swap_count: 4
            fallback_after_swap_count: 1
            volume_token0: 700.0
            volume_token1: 0.35
            volume_token0_equiv: 700.0
            fees_generated_token0: 0.35
            fees_generated_token1: 0.0
            fees_generated_token0_equiv: 0.35

      - input: ref('int_weekly_tick_liquidity_net')
        rows:
          - pool: "0xpool1"
            week_start: "2024-01-01"
            tick: 100
            liquidity_net: 1000
          - pool: "0xpool1"
            week_start: "2024-01-01"
            tick: 110
            liquidity_net: -1000

      - input: ref('int_daily_tick_liquidity_net')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tick: 100
            liquidity_net: 1000
          - pool: "0xpool1"
            date: "2024-01-01"
            tick: 110
            liquidity_net: -1000
          - pool: "0xpool1"
            date: "2024-01-02"
            tick: 100
            liquidity_net: 500
          - pool: "0xpool1"
            date: "2024-01-02"
            tick: 110
            liquidity_net: -500

      - input: ref('mart_tick_liquidity_volume_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tick: 105
            sigma_evc_last: 0.02339871791359518

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xToken0"
            token0_symbol: "TOKEN0"
            token0_decimals: 0
            token1_address: "0xToken1"
            token1_symbol: "TOKEN1"
            token1_decimals: 0
            deployment_block: 1
            deployment_ts: "2024-01-01 00:00:00"

    expect:
      rows:
        - pool: "0xpool1"
          week_start: "2024-01-01"
          tick: 105
          tick_lower: 100
          tick_upper: 110
          tick_liquidity_end: 1000.0
          tick_liquidity_twap: 750.0
          volume_token0_equiv_annualized: 36500.0
          volume_per_tick_liquidity_last: 36.5
          volume_per_tick_liquidity_twap: 48.666666666666664
          sigma_evc_last: 0.006041522986797286
          sigma_evc_twap: 0.00697614984548545
          sigma_evc_mean: 0.02339871791359518
          sigma_evc_std: ~
          sigma_evc_p95: 0.02339871791359518

  - name: test_fee_yield_daily_apr_uses_active_tvl
    description: >
      Verifies that APR is computed on active TVL (in-range positions) and not on total TVL.
      fees_token0_equiv = 1.5, active_tvl_token0 = 300 → APR = 1.5 * 365 / 300 = 1.825.
    model: mart_fee_yield_daily

    given:
      - input: ref('int_active_tvl_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            active_tvl_token0: 300.0

      - input: ref('mart_tvl_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tvl_token0: 200.0
            tvl_token1: 0.1
            price_token1_in_token0: 3000.0
            tvl_token0_equiv: 400.0

      - input: ref('mart_volume_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            volume_token0: 3000.0
            swap_count: 10
            fees_token0_equiv: 1.5

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          tvl_total_token0: 400.0
          tvl_active_token0: 300.0
          tvl_outofrange_token0: 100.0
          fees_token0_equiv: 1.5
          apr: 1.825

  - name: test_fee_yield_daily_preserves_spine_without_matching_rows
    description: >
      Day 1 has active TVL but no volume → fees default to 0, APR = 0.
      Day 2 has volume but no active TVL → APR is NULL.
    model: mart_fee_yield_daily

    given:
      - input: ref('mart_tvl_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tvl_token0: 200.0
            tvl_token1: 0.1
            price_token1_in_token0: 2000.0
            tvl_token0_equiv: 400.0
          - pool: "0xpool1"
            date: "2024-01-02"
            tvl_token0: 210.0
            tvl_token1: 0.1
            price_token1_in_token0: 2000.0
            tvl_token0_equiv: 410.0

      - input: ref('int_active_tvl_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            active_tvl_token0: 300.0

      - input: ref('mart_volume_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-02"
            volume_token0: 3000.0
            swap_count: 10
            fees_token0_equiv: 1.5

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          tvl_total_token0: 400.0
          tvl_active_token0: 300.0
          tvl_outofrange_token0: 100.0
          fees_token0_equiv: 0.0
          apr: 0.0
        - pool: "0xpool1"
          date: "2024-01-02"
          tvl_total_token0: 410.0
          tvl_active_token0: 0.0
          tvl_outofrange_token0: 410.0
          fees_token0_equiv: 1.5
          apr: ~

  - name: test_volume_daily_fees_from_volume_tier
    description: >
      Verifies that generated fees are computed from the input token of each swap.
      fee_bps=0.05 (0.05%). Day 1: swap1 token0-in, swap2 token1-in.
      Day 2: swap3 token0-in only.
    model: mart_volume_daily

    given:
      - input: ref('int_swaps_enriched')
        rows:
          - pool: "0xpool1"
            block_number: 10
            log_index: 0
            block_time: "2024-01-01 10:00:00"
            volume_token0: 1000.0
            volume_token1: 0.285
            volume_token0_equiv: 1000.0
            fees_generated_token0: 0.5
            fees_generated_token1: 0.0
            fees_generated_token0_equiv: 0.5
          - pool: "0xpool1"
            block_number: 11
            log_index: 0
            block_time: "2024-01-01 18:00:00"
            volume_token0: 500.0
            volume_token1: 0.142
            volume_token0_equiv: 497.284
            fees_generated_token0: 0.0
            fees_generated_token1: 0.000071
            fees_generated_token0_equiv: 0.248642
          - pool: "0xpool1"
            block_number: 20
            log_index: 0
            block_time: "2024-01-02 12:00:00"
            volume_token0: 2000.0
            volume_token1: 0.574
            volume_token0_equiv: 2000.0
            fees_generated_token0: 1.0
            fees_generated_token1: 0.0
            fees_generated_token0_equiv: 1.0

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          volume_token0: 1500.0
          volume_token1: 0.427
          volume_token0_equiv: 1497.284
          swap_count: 2
          fees_token0: 0.5
          fees_token1: 0.000071
          fees_token0_equiv: 0.748642
        - pool: "0xpool1"
          date: "2024-01-02"
          volume_token0: 2000.0
          volume_token1: 0.574
          volume_token0_equiv: 2000.0
          swap_count: 1
          fees_token0: 1.0
          fees_token1: 0.0
          fees_token0_equiv: 1.0

  - name: test_tvl_daily_dense_spine_revalues_without_lp_events
    description: >
      mart_tvl_daily builds a dense daily spine and revalues positions even on days
      without LP events.
    model: mart_tvl_daily

    given:
      - input: ref('int_lp_events')
        rows:
          - pool: "0xpool1"
            block_time: "2024-01-01 10:00:00"
            tick_lower: 0
            tick_upper: 10
            liquidity_delta: 1000000

      - input: ref('int_range_liquidity_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tick_lower: 0
            tick_upper: 10
            net_liquidity: 1000000
          - pool: "0xpool1"
            date: "2024-01-02"
            tick_lower: 0
            tick_upper: 10
            net_liquidity: 1000000
          - pool: "0xpool1"
            date: "2024-01-03"
            tick_lower: 0
            tick_upper: 10
            net_liquidity: 1000000

      - input: ref('int_daily_close')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            close_tick: 0
            close_price: 1000000000000.0
            close_sqrt_price: 1.0
          - pool: "0xpool1"
            date: "2024-01-03"
            close_tick: 3
            close_price: 999700059990.001587
            close_sqrt_price: 1.0001500037499376

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            token0_decimals: 6
            token1_decimals: 18

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          price_token1_in_token0: 1000000000000.0
          tvl_token0_equiv: 0.0004998500349929495
        - pool: "0xpool1"
          date: "2024-01-02"
          price_token1_in_token0: 1000000000000.0
          tvl_token0_equiv: 0.0004998500349929495
        - pool: "0xpool1"
          date: "2024-01-03"
          price_token1_in_token0: 999700059990.001587
          tvl_token0_equiv: 0.0004998275406169418

  - name: test_tvl_daily_total_includes_out_of_range_positions
    description: >
      Total TVL includes both the active range and a second range above the current price.
    model: mart_tvl_daily

    given:
