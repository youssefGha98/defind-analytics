            date: "2024-01-02"
            close_tick: 199350
            close_price: 2201.7720656090664

      - input: ref('int_range_liquidity_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tick_lower: 196250
            tick_upper: 200310
            net_liquidity: 100000000000000
          - pool: "0xpool1"
            date: "2024-01-02"
            tick_lower: 196250
            tick_upper: 200310
            net_liquidity: 100000000000000

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          active_range_count: 1
          active_tvl_token0: 965.1100974943738
        - pool: "0xpool1"
          date: "2024-01-02"
          active_range_count: 1
          active_tvl_token0: 893.6123581399345

  # ─── int_active_liquidity_daily ──────────────────────────────────────────────

  - name: test_active_liquidity_daily_basic
    description: >
      Verifies active liquidity computation based on close_tick position within ranges.
      Scenario: 2 positions (A=[100,200] L=1000, B=[150,300] L=500).
    model: int_active_liquidity_daily

    given:
      - input: ref('int_daily_close_dense')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            close_tick: 120
