unit_tests:

  # ─── int_daily_close_dense ──────────────────────────────────────────────────

  - name: test_daily_close_dense_fills_gap_and_flags_has_swap
    description: >
      One swap day on 2024-01-01 and another on 2024-01-03 must generate a dense
      row for 2024-01-02 with carried close state and has_swap=0.
    model: int_daily_close_dense

    given:
      - input: ref('int_daily_close')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            close_tick: 0
            close_price: 1000000000000.0
            close_sqrt_price: 1.0
          - pool: "0xpool1"
            date: "2024-01-03"
            close_tick: 100
            close_price: 250000000000.0
            close_sqrt_price: 2.0

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          close_tick: 0
          close_price: 1000000000000.0
          close_sqrt_price: 1.0
          has_swap: 1
        - pool: "0xpool1"
          date: "2024-01-02"
          close_tick: 0
          close_price: 1000000000000.0
          close_sqrt_price: 1.0
          has_swap: 0
        - pool: "0xpool1"
          date: "2024-01-03"
          close_tick: 100
          close_price: 250000000000.0
          close_sqrt_price: 2.0
          has_swap: 1

  - name: test_daily_close_dense_recomputes_sqrt_from_price
    description: >
      close_sqrt_price must be derived from close_price in the final SELECT,
      not carried independently from int_daily_close.
    model: int_daily_close_dense

    given:
      - input: ref('int_daily_close')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            close_tick: 0
            close_price: 1000000000000.0
            close_sqrt_price: 999.0

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          close_tick: 0
          close_price: 1000000000000.0
          close_sqrt_price: 1.0
          has_swap: 1

  # ─── int_range_liquidity_daily ──────────────────────────────────────────────

  - name: test_range_liquidity_daily_dense_carry_forward
    description: >
      One range is minted on day 1 and remains open through day 3.
      The helper must emit a dense daily range state, including the quiet day 2.
    model: int_range_liquidity_daily

    given:
      - input: ref('int_lp_events')
        rows:
          - pool: "0xpool1"
            block_time: "2024-01-01 10:00:00"
            tick_lower: 0
            tick_upper: 10
            liquidity_delta: 1000

      - input: ref('int_daily_close')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
          - pool: "0xpool1"
            date: "2024-01-03"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          tick_lower: 0
          tick_upper: 10
          net_liquidity: 1000
        - pool: "0xpool1"
          date: "2024-01-02"
          tick_lower: 0
          tick_upper: 10
          net_liquidity: 1000
        - pool: "0xpool1"
          date: "2024-01-03"
          tick_lower: 0
          tick_upper: 10
          net_liquidity: 1000

  - name: test_range_liquidity_daily_full_burn_filters_zero
    description: >
      A full burn on day 2 drives net liquidity to zero, so the helper must stop
      emitting rows for that range from that day onward.
    model: int_range_liquidity_daily

    given:
      - input: ref('int_lp_events')
        rows:
          - pool: "0xpool1"
            block_time: "2024-01-01 10:00:00"
            tick_lower: 0
            tick_upper: 10
            liquidity_delta: 1000
          - pool: "0xpool1"
            block_time: "2024-01-02 10:00:00"
            tick_lower: 0
            tick_upper: 10
            liquidity_delta: -1000

      - input: ref('int_daily_close')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
          - pool: "0xpool1"
            date: "2024-01-03"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          tick_lower: 0
          tick_upper: 10
          net_liquidity: 1000

  - name: test_range_liquidity_daily_same_day_events_aggregate
    description: >
      Multiple LP events on the same calendar day must all affect that day's snapshot.
      This documents the date-level semantics now centralized in the helper.
    model: int_range_liquidity_daily

    given:
      - input: ref('int_lp_events')
        rows:
          - pool: "0xpool1"
            block_time: "2024-01-01 08:00:00"
            tick_lower: 100
            tick_upper: 200
            liquidity_delta: 1000
          - pool: "0xpool1"
            block_time: "2024-01-01 20:00:00"
            tick_lower: 150
            tick_upper: 300
            liquidity_delta: 500
          - pool: "0xpool1"
            block_time: "2024-01-01 23:30:00"
            tick_lower: 120
            tick_upper: 250
            liquidity_delta: 200

      - input: ref('int_daily_close')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          tick_lower: 100
          tick_upper: 200
          net_liquidity: 1000
        - pool: "0xpool1"
          date: "2024-01-01"
          tick_lower: 120
          tick_upper: 250
          net_liquidity: 200
        - pool: "0xpool1"
          date: "2024-01-01"
          tick_lower: 150
          tick_upper: 300
          net_liquidity: 500

  - name: test_range_liquidity_daily_partial_burn_carries_forward
    description: >
      Mint on day 1, partial burn on day 2, quiet day 3.
      The helper must keep the reduced net liquidity on day 3 via the dense spine.
    model: int_range_liquidity_daily

    given:
      - input: ref('int_lp_events')
        rows:
          - pool: "0xpool1"
            block_time: "2024-01-01 10:00:00"
            tick_lower: 0
            tick_upper: 10
            liquidity_delta: 1000
          - pool: "0xpool1"
            block_time: "2024-01-02 10:00:00"
            tick_lower: 0
            tick_upper: 10
            liquidity_delta: -400

      - input: ref('int_daily_close')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
          - pool: "0xpool1"
            date: "2024-01-03"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          tick_lower: 0
          tick_upper: 10
          net_liquidity: 1000
        - pool: "0xpool1"
          date: "2024-01-02"
          tick_lower: 0
          tick_upper: 10
          net_liquidity: 600
        - pool: "0xpool1"
          date: "2024-01-03"
          tick_lower: 0
          tick_upper: 10
          net_liquidity: 600

  # ─── int_hourly_snapshot_blocks ────────────────────────────────────────────

  - name: test_hourly_snapshot_blocks_carries_last_swap_state_through_lp_only_hours
    description: >
      Hours with no swap but with LP activity must still appear in the hourly spine
      and carry the most recent swap-derived state forward.
    model: int_hourly_snapshot_blocks

    given:
      - input: ref('stg_swaps')
        rows:
          - pool: "0xpool1"
            block_number: 10
            log_index: 0
            block_time: "2024-01-01 10:15:00"
            tick: 100
            price_token1_in_token0: 2000.0
          - pool: "0xpool1"
            block_number: 20
            log_index: 1
            block_time: "2024-01-01 12:05:00"
            tick: 110
            price_token1_in_token0: 2100.0

      - input: ref('int_lp_events')
        rows:
          - pool: "0xpool1"
            block_number: 30
            block_time: "2024-01-01 13:20:00"
            tx_hash: "0xlp1"
            log_index: 0
            owner: "0xowner1"
            tick_lower: 90
            tick_upper: 120
            liquidity_delta: 1000
            amount0: 0.0
            amount1: 0.0
            event_type: mint

    expect:
      rows:
        - pool: "0xpool1"
          hour: "2024-01-01 10:00:00"
          has_swap_hour: 1
          snapshot_block_number: 10
          snapshot_log_index: 0
          snapshot_block_time: "2024-01-01 10:15:00"
          current_tick: 100
          price_token1_in_token0: 2000.0
        - pool: "0xpool1"
          hour: "2024-01-01 11:00:00"
          has_swap_hour: 0
          snapshot_block_number: 10
          snapshot_log_index: 0
          snapshot_block_time: "2024-01-01 10:15:00"
          current_tick: 100
          price_token1_in_token0: 2000.0
        - pool: "0xpool1"
          hour: "2024-01-01 12:00:00"
          has_swap_hour: 1
          snapshot_block_number: 20
          snapshot_log_index: 1
          snapshot_block_time: "2024-01-01 12:05:00"
          current_tick: 110
          price_token1_in_token0: 2100.0
        - pool: "0xpool1"
          hour: "2024-01-01 13:00:00"
          has_swap_hour: 0
          snapshot_block_number: 20
          snapshot_log_index: 1
          snapshot_block_time: "2024-01-01 12:05:00"
          current_tick: 110
          price_token1_in_token0: 2100.0

  - name: test_range_liquidity_daily_overlapping_ranges_are_independent
    description: >
      Two overlapping ranges in the same pool must keep separate cumulative states.
      A burn on one range must not affect the other range's net liquidity.
    model: int_range_liquidity_daily

    given:
      - input: ref('int_lp_events')
        rows:
          - pool: "0xpool1"
            block_time: "2024-01-01 10:00:00"
            tick_lower: 100
            tick_upper: 200
            liquidity_delta: 1000
          - pool: "0xpool1"
            block_time: "2024-01-01 11:00:00"
            tick_lower: 150
            tick_upper: 250
            liquidity_delta: 500
          - pool: "0xpool1"
            block_time: "2024-01-02 10:00:00"
            tick_lower: 100
            tick_upper: 200
            liquidity_delta: -400

      - input: ref('int_daily_close')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
          - pool: "0xpool1"
            date: "2024-01-03"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          tick_lower: 100
          tick_upper: 200
          net_liquidity: 1000
        - pool: "0xpool1"
          date: "2024-01-01"
          tick_lower: 150
          tick_upper: 250
          net_liquidity: 500
        - pool: "0xpool1"
          date: "2024-01-02"
          tick_lower: 100
          tick_upper: 200
          net_liquidity: 600
        - pool: "0xpool1"
          date: "2024-01-02"
          tick_lower: 150
          tick_upper: 250
          net_liquidity: 500
        - pool: "0xpool1"
          date: "2024-01-03"
          tick_lower: 100
          tick_upper: 200
          net_liquidity: 600
        - pool: "0xpool1"
          date: "2024-01-03"
          tick_lower: 150
          tick_upper: 250
          net_liquidity: 500

  # ─── int_active_tvl_daily ────────────────────────────────────────────────────

  - name: test_active_tvl_daily_burned_excluded
    description: >
      Pool1 has no surviving range-state row and is therefore excluded.
      Pool2 is a realistic USDC/WETH 0.05% position on range [196250, 200310]
      with L=1e14 at the lower boundary.
    model: int_active_tvl_daily

    given:
      - input: ref('int_daily_close_dense')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            close_tick: 196250
            close_price: 3001.9048030627105
          - pool: "0xpool2"
            date: "2024-01-01"
            close_tick: 196250
            close_price: 3001.9048030627105

      - input: ref('int_range_liquidity_daily')
        rows:
          - pool: "0xpool2"
            date: "2024-01-01"
            tick_lower: 196250
            tick_upper: 200310
            net_liquidity: 100000000000000

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"
          - pool: "0xpool2"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"

    expect:
      rows:
        - pool: "0xpool2"
          date: "2024-01-01"
          active_range_count: 1
          active_tvl_token0: 1006.5595350351274

  - name: test_active_tvl_daily_out_of_range_excluded
    description: >
      Pool1 range [194000, 195000] is out of range at tick 198070 and must be excluded.
      Pool2 uses the production-like range [196250, 200310] at the exact price for tick 198070.
    model: int_active_tvl_daily

    given:
      - input: ref('int_daily_close_dense')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            close_tick: 198070
            close_price: 2502.414637985149
          - pool: "0xpool2"
            date: "2024-01-01"
            close_tick: 198070
            close_price: 2502.414637985149

      - input: ref('int_range_liquidity_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tick_lower: 194000
            tick_upper: 195000
            net_liquidity: 100000000000000
          - pool: "0xpool2"
            date: "2024-01-01"
            tick_lower: 196250
            tick_upper: 200310
            net_liquidity: 100000000000000

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"
          - pool: "0xpool2"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"

    expect:
      rows:
        - pool: "0xpool2"
          date: "2024-01-01"
          active_range_count: 1
          active_tvl_token0: 965.1100974943738

  - name: test_active_tvl_daily_partial_burn
    description: >
      Mint L=1.5e14, burn 0.5e14, net=1e14. Uses the exact boundary price for tick 196250.
    model: int_active_tvl_daily

    given:
      - input: ref('int_daily_close_dense')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            close_tick: 196250
            close_price: 3001.9048030627105

      - input: ref('int_range_liquidity_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tick_lower: 196250
            tick_upper: 200310
            net_liquidity: 100000000000000

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          active_range_count: 1
          active_tvl_token0: 1006.5595350351274

  - name: test_active_tvl_daily_two_positions_same_pool
    description: >
      Two LPs on the same range aggregate. TVL must be 2x the single-position case.
    model: int_active_tvl_daily

    given:
      - input: ref('int_daily_close_dense')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            close_tick: 196250
            close_price: 3001.9048030627105

      - input: ref('int_range_liquidity_daily')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
            tick_lower: 196250
            tick_upper: 200310
            net_liquidity: 200000000000000

      - input: ref('stg_pools')
        rows:
          - pool: "0xpool1"
            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          active_range_count: 1
          active_tvl_token0: 2013.1190700702548

  - name: test_active_tvl_daily_both_tokens_contribute
    description: >
      Production-like in-range case on [196250, 200310] at the exact price for tick 198070.
      Both token0 and token1 contribute to active TVL.
    model: int_active_tvl_daily

    given:
      - input: ref('int_daily_close_dense')
        rows:
          - pool: "0xpool1"
            date: "2024-01-01"
