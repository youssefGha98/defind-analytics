            fee_bps: 0.05
            tick_spacing: 10
            token0_address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            token0_symbol: "USDC"
            token0_decimals: 6
            token1_address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
            token1_symbol: "WETH"
            token1_decimals: 18
            deployment_block: 1
            deployment_ts: "2021-05-05 00:00:00"

    expect:
      rows:
        - pool: "0xpool1"
          date: "2024-01-01"
          active_range_count: 1
          active_tvl_token0: 965.1100974943738

  - name: test_active_tvl_daily_multiday_persistence
    description: >
      A realistic position on [196250, 200310] persists across days as price moves.
      The position stays in-range both days and active TVL reprices accordingly.
    model: int_active_tvl_daily

    given:
      - input: ref('int_daily_close_dense')
        rows:
          - pool: "0xpool1"
