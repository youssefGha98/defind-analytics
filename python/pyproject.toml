[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defind-python-analytics"
version = "0.1.0"
description = "Python analytics layer for path-dependent DeFi analytics on top of dbt canonical tables."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect>=0.7.19",
  "polars>=1.8.2",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.8.0",
  "pytest>=8.0.0",
  "typer>=0.16.0",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics*", "core*", "engines*", "runners*"]

