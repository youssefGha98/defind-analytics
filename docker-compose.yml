services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config/remote:/etc/clickhouse-server/config.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  clickhouse_local:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_local
    ports:
      - "8124:8123"
      - "19000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 11g
    volumes:
      - clickhouse_local_data:/var/lib/clickhouse
      - ./clickhouse/config/local:/etc/clickhouse-server/config.d
      - ${LOCAL_DATALAKE_ROOT:-/home/gharbi/Defind/data}:/var/lib/clickhouse/user_files/defind-data:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
  clickhouse_local_data:
